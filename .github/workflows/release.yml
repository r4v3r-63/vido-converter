name: Windows application

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          choco install ffmpeg --version=7.1.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          $ffmpeg = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw 'FFmpeg executable missing' }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build portable executable
        shell: pwsh
        run: |
          $ffmpeg = (Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Kadr --add-binary "$ffmpeg;." desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          python tests/smoke_packaged.py dist/Kadr.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application failed' }
      - name: Package distribution and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Kadr.exe package/
          Copy-Item WINDOWS.txt package/
          Copy-Item THIRD_PARTY.md package/
          $licenses = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)' }
          New-Item -ItemType Directory -Force package/ffmpeg-licenses | Out-Null
          $i = 0
          foreach ($license in $licenses) { Copy-Item $license.FullName "package/ffmpeg-licenses/$i-$($license.Name)"; $i++ }
          if ($i -eq 0) { throw 'FFmpeg license files missing' }
          Compress-Archive -Path package/* -DestinationPath Kadr-Windows-x64.zip
          (Get-FileHash Kadr-Windows-x64.zip -Algorithm SHA256).Hash + '  Kadr-Windows-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-Windows-x64
          path: |
            Kadr-Windows-x64.zip
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" Kadr-Windows-x64.zip SHA256SUMS.txt --title "Кадр $env:GITHUB_REF_NAME" --notes "Windows x64. Скачайте Kadr-Windows-x64.zip, распакуйте и запустите Kadr.exe. Python и FFmpeg включены; отдельная установка не нужна. Отдельное окно программы, без браузера."
